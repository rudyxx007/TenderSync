name: RAG Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      eval_subset:
        description: "Samples per benchmark (0 = the entire benchmark)"
        required: false
        default: "0"
      run_ablation:
        description: "Run the dense/BM25/hybrid ablation after each evaluation"
        type: boolean
        required: false
        default: false

concurrency:
  group: rag-eval-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  preflight:
    name: Live evaluation preflight
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
    steps:
      - name: Check live-evaluation configuration
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVAL_TENANT_ID: ${{ secrets.EVAL_TENANT_ID }}
          EVAL_USER_ID: ${{ secrets.EVAL_USER_ID }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_SECRET_KEY GROQ_API_KEY EVAL_TENANT_ID EVAL_USER_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$VOYAGE_API_KEY" ] && [ -z "$HF_TOKEN" ]; then
            missing="$missing VOYAGE_API_KEY-or-HF_TOKEN"
          fi
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live evaluation skipped; missing repository secrets:$missing"
            {
              echo "### Live evaluation skipped"
              echo ""
              echo "Missing repository secrets: \`$missing\`."
              echo "Offline tests and dataset validation passed; no metric pass is claimed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  offline-checks:
    name: Offline tests and per-benchmark validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install offline test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run RAG regression tests
        working-directory: backend
        run: |
          python -m pytest tests/test_rag_core.py -v --noconftest
          python -m pytest tests/test_evaluation_standalone.py -v --noconftest

      - name: Validate FinanceBench dataset
        working-directory: backend
        run: |
          python -m evaluation.validate_dataset \
            --dataset evaluation/datasets/financebench.json \
            --benchmark financebench

      - name: Validate CUAD dataset
        working-directory: backend
        run: |
          python -m evaluation.validate_dataset \
            --dataset evaluation/datasets/cuad.json \
            --benchmark cuad

  live-evaluation:
    name: Evaluate ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    needs: [offline-checks, preflight]
    # Push to main or an explicit dispatch. Pull requests never see secrets.
    if: needs.preflight.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        benchmark: [financebench, cuad]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-eval.txt

      - name: Install live evaluation dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-eval.txt

      - name: Seed ${{ matrix.benchmark }} documents
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EVAL_TENANT_ID: ${{ secrets.EVAL_TENANT_ID }}
          EVAL_USER_ID: ${{ secrets.EVAL_USER_ID }}
        run: |
          python -m evaluation.ingest_golden \
            --dataset evaluation/datasets/${{ matrix.benchmark }}.json \
            --output evaluation/seeded/${{ matrix.benchmark }}.json \
            --tenant-id "$EVAL_TENANT_ID" \
            --user-id "$EVAL_USER_ID" \
            --group-by-source

      - name: Evaluate ${{ matrix.benchmark }} only
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EVAL_TENANT_ID: ${{ secrets.EVAL_TENANT_ID }}
        run: |
          python -m evaluation.run_evaluation \
            --benchmark ${{ matrix.benchmark }} \
            --dataset evaluation/seeded/${{ matrix.benchmark }}.json \
            --output evaluation/results/${{ matrix.benchmark }}/eval_report.json \
            --tenant-id "$EVAL_TENANT_ID" \
            --samples "${{ github.event.inputs.eval_subset || '0' }}" \
            --fail-on-thresholds \
            --verbose

      - name: Generate ${{ matrix.benchmark }} report
        if: always()
        working-directory: backend
        run: |
          python -m evaluation.generate_report \
            --input-dir evaluation/results/${{ matrix.benchmark }} \
            --output evaluation/reports/${{ matrix.benchmark }}_report.md \
            --format markdown

      - name: Upload ${{ matrix.benchmark }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-${{ matrix.benchmark }}
          path: |
            backend/evaluation/results/${{ matrix.benchmark }}/
            backend/evaluation/reports/${{ matrix.benchmark }}_report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Upload seeded ${{ matrix.benchmark }} dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-${{ matrix.benchmark }}
          path: backend/evaluation/seeded/${{ matrix.benchmark }}.json
          retention-days: 30
          if-no-files-found: warn

  ablation:
    name: Ablate ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    needs: [preflight, live-evaluation]
    if: github.event_name == 'workflow_dispatch' && inputs.run_ablation && needs.preflight.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        benchmark: [financebench, cuad]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-eval.txt

      - name: Install evaluation dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-eval.txt

      - name: Download seeded ${{ matrix.benchmark }} dataset
        uses: actions/download-artifact@v4
        with:
          name: seeded-${{ matrix.benchmark }}
          path: backend/evaluation/seeded

      - name: Run ${{ matrix.benchmark }} ablation only
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EVAL_TENANT_ID: ${{ secrets.EVAL_TENANT_ID }}
        run: |
          python -m evaluation.run_ablation \
            --benchmark ${{ matrix.benchmark }} \
            --dataset evaluation/seeded/${{ matrix.benchmark }}.json \
            --tenant-id "$EVAL_TENANT_ID" \
            --samples "${{ github.event.inputs.eval_subset || '0' }}" \
            --output evaluation/results/${{ matrix.benchmark }}/ablation_report.json

      - name: Upload ${{ matrix.benchmark }} ablation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-ablation-${{ matrix.benchmark }}
          path: backend/evaluation/results/${{ matrix.benchmark }}/ablation_report.json
          retention-days: 30
          if-no-files-found: warn
